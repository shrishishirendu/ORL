name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  # Matches .env.example / app/core/settings.py (Settings.database_url,
  # Settings.redis_url), pointed at the `postgres`/`redis` service
  # containers below instead of localhost.
  DATABASE_URL: postgresql+asyncpg://orl:orl@localhost:5432/orl
  REDIS_URL: redis://localhost:6379/0

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: orl
          POSTGRES_PASSWORD: orl
          POSTGRES_DB: orl
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orl"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project (with dev dependencies)
        run: pip install -e ".[dev]"

      - name: Run Alembic migrations against the service Postgres
        run: alembic upgrade head

      - name: Lint (ruff check)
        run: ruff check .

      - name: Formatting (ruff format --check)
        run: ruff format --check .

      - name: Run test suite (including tests/integration/, needs Postgres + Redis)
        run: pytest
